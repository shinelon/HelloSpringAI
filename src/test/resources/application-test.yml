server:
  port: 8080
  servlet:
    context-path: /ai

spring:
  application:
    name: hello-spring-ai-test
  autoconfigure:
    exclude:
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiChatAutoConfiguration
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiImageAutoConfiguration

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

  ai:
    provider: openai
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY:test-api-key}
      chat:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY:test-key}
      chat:
        enabled: true

logging:
  level:
    root: WARN
    com.shinelon.hello: DEBUG
